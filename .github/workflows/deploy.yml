name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (base path = repository name)
        run: npm run build
        env:
          # GitHub Pages project sites are served from /<repository-name>/.
          # The repository name is injected here, never hardcoded in source.
          SIYMON_BASE: /${{ github.event.repository.name }}/

      - name: Ensure Pages source is GitHub Actions
        # One-time self-configuration: project sites created in "legacy" (branch)
        # mode would serve raw sources instead of the built app. The workflow
        # token carries `pages: write`, which allows switching the build type.
        run: |
          current="$(curl -sf -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pages" | jq -r '.build_type // empty')"
          echo "current pages build_type: ${current:-none}"
          if [ "$current" != "workflow" ]; then
            curl -sf -X PATCH \
              -H "Authorization: Bearer ${{ github.token }}" \
              -H "Accept: application/vnd.github+json" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pages" \
              -d '{"build_type":"workflow"}' && echo "switched to workflow build type"
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
